[project]
name = "mandarin-tone-feedback-backend"
version = "0.1.0"
description = "Backend API for Mandarin tone feedback"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "librosa>=0.10",
  "soundfile>=0.12",
  "scikit-learn>=1.4",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "transformers>=4.40",
  "umap-learn>=0.5",
  "matplotlib>=3.8",
  "pandas>=2.2"
]
test = [
  "pytest>=8.0",
  "httpx>=0.27"
]
